<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Crypto Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js CDN for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>Live Crypto Dashboard</h1>
        
        <div class="controls">
            <input type="text" id="search-bar" placeholder="Search for a coin...">
            
            <!-- Global Currency Selector -->
            <select id="currency-selector">
                <option value="usd">USD ($)</option>
                <option value="eur">EUR (€)</option>
                <option value="inr">INR (₹)</option>
            </select>
            
            <button id="portfolio-toggle">View My Portfolio</button>
        </div>
        
        <div id="skeleton-container">
            <p style="color: #aaa; font-style: italic;">Loading market data...</p>
        </div>

        <!-- The scrollable grid for 250 coins -->
        <div id="crypto-container"></div>
    </div>

    <!-- Chart Modal (Hidden by default) -->
    <div id="chart-modal" style="display: none;">
        <div class="modal-content">
            <h2 id="modal-coin-name"></h2>
            <canvas id="coin-chart"></canvas>
            <button id="close-modal">Close Chart</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
